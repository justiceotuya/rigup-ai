name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # engines says node >= 18; keep the oldest still-supported LTS covered
          - os: ubuntu-latest
            node: 20
    env:
      # postinstall builds + `npm link`s the CLI globally; skip that in CI
      RIGUP_SKIP_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: CLI smoke test
        run: node dist/index.js --help
